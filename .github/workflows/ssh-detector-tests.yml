name: SSH Detector Tests

on:
  push:
    paths:
      - "projects/ssh-brute-force-detector/**"
      - ".github/workflows/ssh-detector-tests.yml"
  pull_request:
    paths:
      - "projects/ssh-brute-force-detector/**"
      - ".github/workflows/ssh-detector-tests.yml"

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline unit tests
        working-directory: projects/ssh-brute-force-detector
        run: python -m unittest discover -s tests -v
